<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEME CASE — апгрейдер мем-скинов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=3">
</head>
<body>
<div id="app"></div>

<script>
/* Данные каталога переданы с сервера (Python) в JSON — используются
   только для отображения (превью цели апгрейда, цвета редкости).
   Все РЕАЛЬНЫЕ изменения баланса/инвентаря происходят через fetch()
   к Flask-эндпоинтам /api/*, то есть считает сервер, а не браузер. */
const RARITY    = {{ rarity | tojson }};
const ITEM_POOL = {{ item_pool | tojson }};
const CASES     = {{ cases | tojson }};

const ui = {
  page:'cases', platform:window.innerWidth >= 760 ? 'pc' : 'phone', modal:null, upgradeInputId:null, upgradeTargetId:null, upgradeChance:0,
  theme:'dark', accent:'sunset', navFrom:0, upgrading:false, upgradeSpin:'0deg',
  pageMotion:'none', authMode:'register', authError:'', adminUsers:[], adminTarget:null, profiles:[],
  caseFilter:'Все', caseSearch:'', opening:false
};
let game = { coins:0, cases_opened:0, inventory:[], best_drop:null, discovered:[], user:null };

function icon(name){ return `<img class="ui-icon" src="/static/ui/${name}.svg" alt="" aria-hidden="true">`; }
function brandVisual(){ return `<div class="brand"><img src="/static/ui/logo.svg" alt="MEME CASE"><div><b>MEME<span>CASE</span></b><small>COLLECT YOUR VIBE</small></div></div>`; }

function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
function rColor(rarity){ return `var(--r-${rarity})`; }
function escapeHtml(value){ return String(value ?? '').replace(/[&<>'"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
function itemVisual(item){
  return `<img class="item-media" src="${item.image || '/static/ui/spark.svg'}" alt="${escapeHtml(item.name)}" loading="lazy">`;
}
function avatarVisual(){
  return `<img class="avatar-img" src="${game.user?.avatar_url || '/static/ui/avatar.svg'}" alt="Аватар ${escapeHtml(game.user?.username || '')}">`;
}
function applyState(data){
  game.coins = data.coins; game.cases_opened = data.cases_opened;
  game.inventory = data.inventory || [];
  game.best_drop = data.best_drop || game.best_drop || null;
  // discovered — все когда-либо полученные персонажи (даже после продажи)
  if (Array.isArray(data.discovered)) {
    game.discovered = data.discovered;
  } else {
    // fallback: собираем из инвентаря и best_drop
    const ids = new Set(game.discovered || []);
    for (const it of game.inventory) if (it && it.id) ids.add(it.id);
    if (game.best_drop && game.best_drop.id) ids.add(game.best_drop.id);
    game.discovered = [...ids];
  }
  game.user = data.user || null;
}
function findNearestItem(value){
  let best=ITEM_POOL[0], bestDiff=Infinity;
  for(const it of ITEM_POOL){ const d=Math.abs(it.value-value); if(d<bestDiff){bestDiff=d; best=it;} }
  return best;
}
function upgradeSpinFor(success, chance){
  // Стрелка каждый раз останавливается в случайной точке нужного сектора,
  // поэтому одинаковый шанс больше не приводит к одному и тому же кадру.
  const greenAngle = Math.max(4, Math.min(356, chance * 3.6));
  const landingAngle = success
    ? 2 + Math.random() * Math.max(1, greenAngle - 4)
    : greenAngle + 2 + Math.random() * Math.max(1, 356 - greenAngle);
  const turns = 4 + Math.floor(Math.random() * 3);
  return `${(turns * 360 + landingAngle).toFixed(1)}deg`;
}

async function api(path, opts={}){
  const isForm = opts.body instanceof FormData;
  const headers = Object.assign({}, isForm ? {} : {'Content-Type':'application/json'}, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error || 'request_failed'); }
  return data;
}

async function refreshFromServer(){
  const d = await api('/api/state');
  applyState(d);
}
function upgradeChanceFor(input, target){
  if(!input || !target || target.value<=input.value) return 0;
  return Math.max(2, Math.min(75, input.value / target.value * 100));
}
function sortedCharacters(){ return [...ITEM_POOL].sort((a,b)=>a.value-b.value); }

function toast(msg){
  msg = msg.replace(/[\u{1F300}-\u{1FAFF}\uFE0F]/gu, '').trim();
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ======================= RENDER ======================= */
function render(){
  document.body.className = `mode-${ui.platform} theme-${ui.theme} accent-${ui.accent}`;
  const app = document.getElementById('app');
  if(!game.user){ app.innerHTML = renderAuth(); bindEvents(); return; }
  app.innerHTML = `
    <div class="app-layout">
      <aside class="sidebar">
        ${brandVisual()}
        <div class="sidebar-label">ТВОЯ ТЕРРИТОРИЯ</div>
        ${renderTopNav()}
        <div class="sidebar-bottom">
          <div class="sidebar-promo"><img src="/static/cases/free.png" alt="Бесплатный кейс"><b>Твой первый дроп</b><span>Бесплатно. Сколько захочешь.</span><button data-action="open-case" data-case="free">Забрать кейс ${icon('arrow')}</button></div>
          <button class="sidebar-settings" data-action="open-settings">${icon('settings')} Настройки</button>
          <div class="sidebar-caption">MEME CASE / COLLECT YOUR VIBE</div>
        </div>
      </aside>
      <div class="main-shell">
        ${renderTopbar()}
        <main class="content-shell">
          ${renderPageHead()}
          <div class="page ${ui.pageMotion!=='none'?'page-enter':''}">${renderPage()}</div>
          <footer class="app-footer"><span>MEME CASE</span><span>Мемы заканчиваются. Коллекция — нет.</span><button data-action="open-profiles">Сообщество ${icon('arrow')}</button></footer>
        </main>
      </div>
    </div>
    ${renderBottomNav()}
    ${renderModal()}
    <div class="toast" id="toast" role="status"></div>`;
  bindEvents();
}

function renderAuth(){
  const registering = ui.authMode==='register';
  return `<main class="auth-screen">
    <section class="auth-visual">${brandVisual()}<div class="auth-manifesto"><span class="eyebrow">ИНТЕРНЕТ В ТВОЕЙ КОЛЛЕКЦИИ</span><h1>Собирай<br>то, что<br><em>смешно.</em></h1><p>Открывай кейсы. Находи любимых персонажей.<br>Собери свою легендарную коллекцию.</p></div><img class="auth-chest" src="/static/cases/meme_case.png" alt="Легендарный золотой кейс"><span class="auth-edition">MEME CULTURE / COLLECT & UPGRADE</span></section>
    <section class="auth-form-panel"><div class="auth-card" aria-label="Авторизация"><span class="eyebrow">ТВОЙ СЛЕДУЮЩИЙ ДРОП ЖДЁТ</span><h2>${registering?'Вступай в игру':'С возвращением'}</h2><p class="auth-subtitle">${registering?'Всё начинается с одного кейса. Бесплатного.':'Твоя коллекция уже заждалась.'}</p>
      <div class="auth-tabs"><button class="${registering?'active':''}" data-action="auth-mode" data-mode="register">Регистрация</button><button class="${!registering?'active':''}" data-action="auth-mode" data-mode="login">Войти</button></div>
      <label for="authUsername">Твой никнейм</label><input id="authUsername" autocomplete="username" maxlength="24" placeholder="Как тебя называть?">
      <label for="authPassword">Пароль</label><input id="authPassword" type="password" autocomplete="${registering?'new-password':'current-password'}" maxlength="128" placeholder="Минимум 4 символа">
      <button class="auth-submit" data-action="auth-submit">${registering?'Создать аккаунт':'Войти в аккаунт'} ${icon('arrow')}</button><div class="auth-error" role="alert">${escapeHtml(ui.authError)}</div>
      <div class="auth-help">Никнейм: 3–24 символа. Буквы, цифры, _ или -.</div><div class="auth-benefit">${icon('gift')} Бесплатный кейс без ограничений</div>
    </div></section>
  </main>`;
}

function renderTopbar(){
  const title = tabs().find(t=>t.id===ui.page)?.label || 'Кейсы';
  return `<header class="topbar"><div class="mobile-brand">${brandVisual()}</div><div class="breadcrumb">ПЛОЩАДКА <span>/</span> <b>${title}</b></div><div class="topbar-actions"><button class="balance" data-action="open-buy" title="Пополнить баланс">${icon('coin')}<span><small>ТВОЙ БАЛАНС</small><b>${fmt(game.coins)} <i>M</i></b></span><span class="balance-plus">${icon('plus')}</span></button><button class="user-chip" data-action="goto" data-page="profile"><span class="user-avatar">${avatarVisual()}</span><span class="user-name">${escapeHtml(game.user.username)}${game.user.is_admin ? icon('shield') : ''}</span>${icon('chevron')}</button></div></header>`;
}

function tabs(){
  return [
    {id:'cases', label:'Кейсы', ic:'<img class="ui-icon" src="/static/ui/cases.svg" alt="" aria-hidden="true">'},
    {id:'upgrade', label:'Апгрейд', ic:'<img class="ui-icon" src="/static/ui/upgrade.svg" alt="" aria-hidden="true">'},
    {id:'gallery', label:'Витрина', ic:'<img class="ui-icon" src="/static/ui/gallery.svg" alt="" aria-hidden="true">'},
    {id:'inventory', label:'Инвентарь', ic:'<img class="ui-icon" src="/static/ui/inventory.svg" alt="" aria-hidden="true">'},
    {id:'profile', label:'Профиль', ic:'<img class="ui-icon" src="/static/ui/profile.svg" alt="" aria-hidden="true">'},
  ];
}
function tabIndex(page){ return Math.max(0, tabs().findIndex(t=>t.id===page)); }
function renderNav(kind){
  return `<nav class="${kind} nav-switcher" aria-label="Основная навигация">${tabs().map(t=>`<button class="nav-btn ${ui.page===t.id?'active':''}" data-action="goto" data-page="${t.id}" aria-current="${ui.page===t.id?'page':'false'}"><span class="ic">${t.ic}</span><span>${t.label}</span><span class="nav-end">${icon('chevron')}</span></button>`).join('')}</nav>`;
}
function renderTopNav(){
  return renderNav('top-nav');
}
function renderBottomNav(){
  return renderNav('bottom-nav');
}

function renderPageHead(){
  if(ui.page==='cases') return `<section class="hero-panel"><div class="hero-watermark" aria-hidden="true">DROP</div><div class="hero-copy"><span class="hero-label">${icon('gift')} ТВОЙ БЕСПЛАТНЫЙ СТАРТ</span><h1>Хороший мем.<br><em>Отличный дроп.</em></h1><p>Твои любимые персонажи — в одной коллекции.<br>Открой первый кейс. Дальше будет интереснее.</p><div class="hero-actions"><button class="primary-btn" data-action="open-case" data-case="free">Открыть бесплатно ${icon('arrow')}</button><button class="text-btn" data-action="goto" data-page="gallery">Смотреть коллекцию ${icon('chevron')}</button></div></div><div class="hero-art"><div class="hero-orbit"></div><img src="/static/cases/free.png" alt="Бесплатный бело-мятный кейс"><span class="hero-art-label"><b>0 M</b> НОЛЬ МОНЕТ. МАКСИМУМ МЕМОВ.</span></div><span class="hero-index">01 / FREE COLLECTION</span></section>
    <div class="collection-strip"><span>${icon('cases')} <b>${CASES.length}</b> кейсов на любой вайб</span><span>${icon('gallery')} <b>${ITEM_POOL.length}</b> персонажа в коллекции</span><span>${icon('upgrade')} Апгрейд до легенды</span></div>
    <section class="page-head"><div class="section-heading"><div><span class="eyebrow">ВЫБИРАЙ. ОТКРЫВАЙ. СОБИРАЙ.</span><h2>Все кейсы<span class="heading-count">${String(CASES.length).padStart(2,'0')}</span></h2></div><div class="search-box">${icon('search')}<input id="caseSearch" aria-label="Поиск кейса" placeholder="Найти свой кейс" value="${escapeHtml(ui.caseSearch)}"></div></div><div class="filter-row">${['Все','Бесплатные','Популярные','Новые','Недорогие','Особые'].map(f=>`<button class="chip ${ui.caseFilter===f?'active':''}" data-action="set-case-filter" data-filter="${f}">${f}</button>`).join('')}</div></section>`;
  const heads = {upgrade:['СЛЕДУЮЩИЙ УРОВЕНЬ','Апгрейд','Преврати свой дроп в нечто большее.'], gallery:['СОБЕРИ ИХ ВСЕХ','Коллекция','От первого мема до легенды интернета.'], inventory:['ТВОЯ ДОБЫЧА','Инвентарь','Всё, что ты уже успел забрать.'], profile:['ТВОЯ ТЕРРИТОРИЯ','Профиль','Коллекция, статистика и твой стиль.']};
  const h = heads[ui.page];
  return h ? `<section class="page-head inner-page-head"><span class="eyebrow">${h[0]}</span><h1>${h[1]}<span class="heading-dot"></span></h1><p>${h[2]}</p></section>` : '';
}

function renderPage(){
  if(ui.page==='cases') return renderCases();
  if(ui.page==='upgrade') return renderUpgrade();
  if(ui.page==='gallery') return renderGallery();
  if(ui.page==='inventory') return renderInventory();
  if(ui.page==='profile') return renderProfile();
  return '';
}

function caseMatchesFilter(c){
  const filter = ui.caseFilter || 'Все';
  const query = (ui.caseSearch || '').trim().toLowerCase();
  const byFilter = filter === 'Все' || (c.tags || []).includes(filter);
  const byQuery = !query || c.name.toLowerCase().includes(query);
  return byFilter && byQuery;
}
function caseGridInner(){
  const list = CASES.filter(caseMatchesFilter);
  if(!list.length) return `<div class="empty-state"><span class="em">${icon('search')}</span><h3>Ничего не нашлось</h3><p>Попробуй другое название или выбери другую категорию.</p></div>`;
  return list.map(c=>`<button class="case-card ${c.price===0?'is-free':''}" style="--case-color:${c.color}" data-action="open-case" data-case="${c.id}" aria-label="${escapeHtml(c.name)} — ${c.price===0?'бесплатно':`${fmt(c.price)} M`}"><span class="case-topline"><span class="case-badge">${c.price===0?'FREE DROP':c.tags.includes('Особые')?'SPECIAL EDITION':'MEME COLLECTION'}</span>${icon('arrow')}</span><span class="case-box case-box-image"><img class="case-art" src="${c.image}" alt="3D-кейс ${escapeHtml(c.name)}" loading="lazy"></span><span class="title">${escapeHtml(c.name.replace(/[«»]/g,''))}</span><span class="case-caption">${c.price===0?'Без ограничений. Всегда бесплатно.':`Дроп от ${fmt(c.min_value)} до ${fmt(c.max_value)} M`}</span><span class="case-price">${c.price===0?icon('gift'):icon('coin')} ${c.price===0?'Бесплатно':`${fmt(c.price)} M`}<span class="case-price-arrow">${icon('arrow')}</span></span></button>`).join('');
}
function renderCases(){
  return `<div class="case-grid" id="caseGrid">${caseGridInner()}</div>`;
}

function renderUpgrade(){
  const input = game.inventory.find(i=>i.instance_id===ui.upgradeInputId);
  const targetItem = ITEM_POOL.find(i=>i.id===ui.upgradeTargetId);
  const chance = upgradeChanceFor(input,targetItem);
  ui.upgradeChance = chance;
  return `<div class="upgrade-wrap"><section class="upgrade-stage ${ui.upgrading?'is-upgrading':''}"><div class="workbench-heading"><span>${icon('bolt')} СТАНЦИЯ АПГРЕЙДА</span><span>01 → 02</span></div><div class="upgrade-slots">
    <div class="slot ${input?'has-item':''}"><span class="label">01 / ТВОЙ ПРЕДМЕТ</span><div class="slot-item">${input?`<div class="icon">${itemVisual(input)}</div><div class="name">${escapeHtml(input.name)}</div><div class="val">${fmt(input.value)} M</div>`:`<img class="slot-placeholder" src="/static/ui/inventory.svg" alt=""><div class="slot-empty">Что будем улучшать?</div>`}</div><button class="slot-pick-btn" data-action="open-pick-input" ${ui.upgrading?'disabled':''}>${icon('plus')} Выбрать предмет</button></div>
    <div class="chance-wrap"><div class="wheel-shell ${ui.upgrading?'is-spinning':''}" style="--pct:${chance};--spin:${ui.upgradeSpin}"><div class="upgrade-wheel" aria-label="Колесо шанса"><div class="wheel-pointer" aria-hidden="true"></div><div class="wheel-hub"><span>ТВОЙ ШАНС</span><b>${chance.toFixed(1)}<small>%</small></b><img src="/static/ui/bolt.svg" alt=""></div></div></div><div class="wheel-legend"><span class="win">УСПЕХ</span><span class="lose">НЕУДАЧА</span></div></div>
    <div class="slot target-slot ${targetItem?'has-item':''}"><span class="label">02 / ТВОЯ ЦЕЛЬ</span><div class="slot-item">${targetItem?`<div class="icon">${itemVisual(targetItem)}</div><div class="name">${escapeHtml(targetItem.name)}</div><div class="val">${fmt(targetItem.value)} M</div>`:`<img class="slot-placeholder" src="/static/ui/spark.svg" alt=""><div class="slot-empty">Выбери следующий уровень</div>`}</div><button class="slot-pick-btn" data-action="open-pick-target" ${!input||ui.upgrading?'disabled':''}>${icon('plus')} Выбрать цель</button></div>
    </div><div class="upgrade-status">${ui.upgrading?'Идёт апгрейд…':input&&targetItem?'Шанс рассчитан по стоимости выбранной цели':'Выбери свой предмет и персонажа, которого хочешь получить'}</div><button class="upgrade-cta" data-action="do-upgrade" ${!input||!targetItem||ui.upgrading?'disabled':''}>${icon('upgrade')} ${ui.upgrading?'СОЗДАЁМ НОВЫЙ ДРОП…':'ЗАПУСТИТЬ АПГРЕЙД'} ${icon('arrow')}</button></section><div class="how-it-works"><div><b>01</b><h3>Выбери предмет</h3><p>Используй любой дроп из своего инвентаря.</p></div><div><b>02</b><h3>Найди свою цель</h3><p>Чем дороже цель, тем ниже шанс успеха.</p></div><div><b>03</b><h3>Испытай удачу</h3><p>При успехе забери новый предмет. При неудаче исходный предмет теряется.</p></div></div></div>`;
}

function renderGallery(){
  const owned = new Set(game.discovered || []);
  // На всякий случай учитываем и текущий инвентарь
  for (const it of game.inventory || []) if (it && it.id) owned.add(it.id);
  const total = ITEM_POOL.length;
  const count = [...owned].filter(id => ITEM_POOL.some(it => it.id === id)).length;
  return `<div class="gallery-intro">Все персонажи расположены от самого дешёвого к самому дорогому. Серые карточки ещё не выпадали вам — открытые остаются открытыми даже после продажи.</div>
    <div class="inv-summary" style="margin-bottom:14px">
      <div><div class="n">${count} / ${total}</div><div class="l">ПЕРСОНАЖЕЙ ОТКРЫТО</div></div>
      <div style="text-align:right"><div class="n" style="color:var(--accent-orange)">${total ? Math.round(count / total * 100) : 0}%</div><div class="l">КОЛЛЕКЦИЯ</div></div>
    </div>
    <div class="gallery-grid">
      ${sortedCharacters().map(item=>`<div class="gallery-card ${owned.has(item.id)?'':'unknown'}" style="--rc:${rColor(item.rarity)}">
        <div class="gallery-image">${itemVisual(item)}</div>
        ${owned.has(item.id)?'<span class="owned"><img class="ui-icon" src="/static/ui/check.svg" alt="" aria-hidden="true"></span>':'<span class="locked"><img class="ui-icon" src="/static/ui/lock.svg" alt="" aria-hidden="true"></span>'}
        <div class="gallery-name">${escapeHtml(item.name)}</div>
        <div class="gallery-meta"><span>${RARITY[item.rarity].label}</span><b>${fmt(item.value)} M</b></div>
      </div>`).join('')}
    </div>`;
}

function renderInventory(){
  const total = game.inventory.reduce((s,i)=>s+i.value,0);
  if(game.inventory.length===0){
    return `<div class="empty-state"><span class="em"><img class="ui-icon" src="/static/ui/inventory.svg" alt="" aria-hidden="true"></span>Инвентарь пуст.<br>Откройте кейс, чтобы получить предметы!</div>`;
  }
  return `
    <div class="inv-summary">
      <div><div class="n">${game.inventory.length}</div><div class="l">ПРЕДМЕТОВ</div></div>
      <div style="text-align:right"><div class="n" style="color:var(--accent-orange)">${fmt(total)} M</div><div class="l">ОБЩАЯ ЦЕННОСТЬ</div></div>
    </div>
    <div class="inventory-note">Продажа возвращает 100% стоимости. Заголовки закреплены, поэтому название, вид и цена видны при прокрутке.</div>
    <button class="settings-btn" data-action="sell-all" style="justify-content:center;margin-bottom:12px"><img class="ui-icon" src="/static/ui/coin.svg" alt="" aria-hidden="true"> Продать всё разом · +${fmt(game.inventory.reduce((sum,item)=>sum+(item.sell_value||item.value),0))} M</button>
    <div class="inventory-sticky"><span>Название</span><span>Вид</span><span>Цена</span></div>
    <div class="sell-list">
      ${game.inventory.map(it=>`
        <div class="sell-row" style="--rc:${rColor(it.rarity)}">
          <div class="sell-thumb">${itemVisual(it)}</div>
          <div class="sell-name">${escapeHtml(it.name)}<div class="sell-rarity" style="color:${rColor(it.rarity)}">${RARITY[it.rarity].label}</div></div>
          <div class="sell-type">${escapeHtml(it.type || 'Персонаж')}</div>
          <div class="sell-price"><small>${fmt(it.value)} M</small><span>${fmt(it.sell_value || it.value)} M</span><button class="sell-btn" data-action="sell-item" data-id="${it.instance_id}">Продать</button></div>
        </div>
      `).join('')}
    </div>`;
}

function renderProfile(){
  const total = game.inventory.reduce((s,i)=>s+i.value,0);
  const top = game.best_drop || null;
  return `
    <div class="profile-hero">
      <div class="big-avatar">${avatarVisual()}</div>

/* ======================= ACTIONS ======================= */
let navReleaseTimer;
function goto(page){
  if(page===ui.page) return;
  const previous = tabIndex(ui.page);
  ui.navFrom = previous;
  // Переход из кейсов в апгрейдер уходит снизу, как отдельный игровой экран.
  ui.pageMotion = ui.page==='cases' && page==='upgrade' ? 'bottom' : (tabIndex(page) > previous ? 'right' : 'left');
  ui.page = page;
  // При перезаходе на апгрейд колесо и стрелка возвращаются в исходное состояние.
  ui.upgrading = false;
  ui.upgradeSpin = '0deg';
  ui.modal = null;
  render();
  window.scrollTo({top:0, behavior:'instant'});
  clearTimeout(navReleaseTimer);
  navReleaseTimer = setTimeout(()=>{ ui.navFrom = tabIndex(ui.page); }, 450);
}

async function openCase(caseId){
  const c = CASES.find(x=>x.id===caseId);
  if(!c) return;
  if(game.coins < c.price){ toast('Недостаточно монет '); return; }
  // Защита от дюпа: пока запрос открытия в полёте, второй клик игнорируется.
  if(ui.opening) return;
  ui.opening = true;

  // визуальная рулетка: реальный выигрыш запрашиваем у сервера сразу,
  // сервер уже посчитал вес редкости и списал монеты
  let data;
  try{
    data = await api(`/api/open_case/${caseId}`, {method:'POST'});
  }catch(e){
    ui.opening = false;
    toast('Не получилось открыть кейс ');
    return;
  }
  const won = data.won;
  // Баланс и инвентарь применяем сразу после ответа сервера, а не по таймеру
  // анимации: закрытие рулетки больше не оставляет монеты не списанными.
  applyState(data);
  ui.opening = false;
  const strip = [];
  const winIndex = 27;
  const caseItems = ITEM_POOL.filter(item=>item.value>=c.min_value && item.value<=c.max_value);
  for(let i=0;i<35;i++) strip.push(caseItems[Math.floor(Math.random()*caseItems.length)]);
  strip[winIndex] = won;

  ui.modal = { type:'caseOpen', data:{ caseName:c.name, strip, winIndex } };
  render();

  requestAnimationFrame(()=>{
    const track = document.getElementById('reelTrack');
    const outer = document.getElementById('reelOuter');
    const winner = track?.querySelector('.winner');
    const progress = document.getElementById('reelProgress');
    const status = document.getElementById('reelStatus');
    if(!track || !outer || !winner) return;
    const targetX = outer.clientWidth/2 - winner.offsetLeft - winner.offsetWidth/2 + (Math.random()*8-4);
    requestAnimationFrame(()=>{
      progress?.classList.add('running');
      track.style.transition = 'transform 3.35s cubic-bezier(.08,.78,.1,1)';
      track.style.transform = `translateX(${targetX}px)`;
    });
    setTimeout(()=>{
      outer.classList.add('complete');
      if(status) status.textContent = 'РЕЗУЛЬТАТ!';
      if(progress){ progress.classList.remove('running'); progress.querySelector('.status').textContent = 'Готово'; }
      applyState(data);
      const rC = document.getElementById('reelResult');
      if(rC){
        rC.innerHTML = `
          <div class="result-card">
            <div class="icon">${itemVisual(won)}</div>
            <div class="name">${won.name}</div>
            <div class="rarity" style="color:${rColor(won.rarity)}">${RARITY[won.rarity].label}</div>
            <div class="value">${fmt(won.value)} M</div>
          </div>
          <button class="primary-btn" data-action="close-modal">Забрать</button>
        `;
        bindEvents();
      }
    }, 3550);
  });
}

async function doUpgrade(){
  const input = game.inventory.find(i=>i.instance_id===ui.upgradeInputId);
  const target = ITEM_POOL.find(item=>item.id===ui.upgradeTargetId);
  const chance = upgradeChanceFor(input,target);
  if(!input || !target || !chance || ui.upgrading) return;

  // Блокируем кнопку до отправки запроса, чтобы быстрый второй клик
  // не создал второй запрос на тот же предмет.
  ui.upgrading = true;
  render();

  let data;
  try{
    data = await api('/api/upgrade', {
      method:'POST',
      body: JSON.stringify({ instance_id: input.instance_id, target_id: target.id })
    });
  }catch(e){
    ui.upgrading = false;
    render();
    toast('Ошибка апгрейда ');
    return;
  }
  ui.upgradeSpin = upgradeSpinFor(data.success, data.chance);
  render();
  setTimeout(()=>{
    game.coins = data.coins; game.inventory = data.inventory; game.best_drop = data.best_drop || game.best_drop;
    ui.upgradeInputId = null;
    ui.upgradeTargetId = null;
    ui.upgrading = false;
    ui.upgradeSpin = '0deg';
    ui.modal = { type:'upgradeResult', data:{ success:data.success, item:data.item } };
    render();
  }, 1450);
}

async function sellItem(instanceId){
  const item = game.inventory.find(entry=>entry.instance_id===instanceId);
  if(!item) return;
  try{
    const data = await api('/api/sell', {method:'POST', body:JSON.stringify({instance_id:instanceId})});
    applyState(data);
    if(ui.upgradeInputId===instanceId) ui.upgradeInputId = null;
    render();
    toast(`Продано: ${item.name} · +${fmt(data.earned)} M`);
  }catch(error){
    toast(error.message==='item_not_found' ? 'Этот предмет уже продан' : 'Не удалось продать предмет');
  }

}

async function sellAll(){
  if(!game.inventory.length){ toast('Инвентарь пуст'); return; }
  try{
    const data = await api('/api/sell_all', {method:'POST'});
    applyState(data);
    ui.upgradeInputId = null;
    render();
    toast(`Продано предметов: ${data.sold_count} · +${fmt(data.earned)} M`);
  }catch(error){ toast('Не удалось продать предметы'); }
}

async function openProfiles(){
  try{
    const data = await api('/api/profiles');
    ui.profiles = data.profiles || [];
    ui.modal = {type:'profiles'};
    render();
  }catch(error){ toast('Не удалось загрузить профили игроков'); }
}

function authErrorMessage(error){
  return ({
    invalid_username:'Никнейм: 3–24 символа, только буквы, цифры, _ или -.',
    invalid_password:'Пароль должен содержать от 4 до 128 символов.',
    username_taken:'Этот никнейм уже занят.', invalid_credentials:'Неверный никнейм или пароль.',
    banned:'Этот аккаунт заблокирован.', auth_required:'Войдите в аккаунт.'
  })[error] || 'Не удалось выполнить действие. Попробуйте ещё раз.';
}

async function authenticate(){
  const username = document.getElementById('authUsername')?.value.trim() || '';
  const password = document.getElementById('authPassword')?.value || '';
  try{
    const data = await api(`/api/${ui.authMode}`, {method:'POST', body:JSON.stringify({username,password})});
    applyState(data);
    ui.authError = '';
    ui.page = 'cases';
    render();
    toast(ui.authMode==='register' ? 'Аккаунт создан. Добро пожаловать!' : 'С возвращением!');
  }catch(error){
    ui.authError = authErrorMessage(error.message);
    render();
  }
}

async function uploadAvatar(file){
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){ toast('Размер аватара — до 2 МБ'); return; }
  const form = new FormData();
  form.append('avatar', file);
  try{
    const data = await api('/api/avatar', {method:'POST', body:form});
    applyState(data);
    render();
    toast('Аватар обновлён');
  }catch(error){ toast(error.message==='avatar_format' ? 'Поддерживаются PNG, JPG, WEBP и GIF' : 'Не удалось загрузить аватар'); }
}

async function openAdmin(){
  try{
    const data = await api('/api/admin/users');
    ui.adminUsers = data.users || [];
    ui.adminTarget = ui.adminUsers.find(user=>user.id!==game.user.id)?.id || null;
    ui.modal = {type:'admin'};
    render();
  }catch(error){ toast('Не удалось открыть админ-панель'); }
}

async function refreshAdmin(){
  const data = await api('/api/admin/users');
  ui.adminUsers = data.users || [];
}

async function adminSelfCoins(){
  const amount = document.getElementById('adminSelfCoins')?.value;
  try{
    const data = await api('/api/admin/action', {method:'POST', body:JSON.stringify({action:'self_coins', target_id: game.user.id, amount})});
    await refreshFromServer();
    ui.modal = {type:'admin'};
    render();
    toast(data.message);
  }catch(error){ toast('Не удалось начислить монеты'); }
}

async function adminAction(action, extra={}){
  if(!ui.adminTarget) return;
  try{
    const data = await api('/api/admin/action', {method:'POST', body:JSON.stringify({action, target_id:ui.adminTarget, ...extra})});
    await refreshAdmin();
    ui.modal = {type:'admin'};
    render();
    toast(data.message);
  }catch(error){ toast(error.message==='self_action_forbidden' ? 'Нельзя применить это действие к себе' : 'Не удалось выполнить действие'); }
}

async function logout(){
  await api('/api/logout', {method:'POST'}).catch(()=>{});
  game = {coins:0, cases_opened:0, inventory:[], best_drop:null, discovered:[], user:null};
  ui.modal = null;
  ui.authMode = 'login';
  ui.authError = '';
  render();
}

/* ======================= EVENT BINDING ======================= */
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = ()=>{
      const a = el.dataset.action;
      if(a==='goto') goto(el.dataset.page);
      else if(a==='auth-mode'){ ui.authMode=el.dataset.mode; ui.authError=''; render(); }
      else if(a==='auth-submit') authenticate();
      else if(a==='open-buy'){ ui.modal={type:'buy'}; render(); }
      else if(a==='open-settings'){ ui.modal={type:'settings'}; render(); }
      else if(a==='open-profiles'){ openProfiles(); }
      else if(a==='open-admin'){ openAdmin(); }
      else if(a==='open-pick-input'){ ui.modal={type:'pickInput'}; render(); }
      else if(a==='open-pick-target'){ ui.modal={type:'pickTarget'}; render(); }
      else if(a==='close-modal'){ ui.modal=null; render(); }
      else if(a==='open-case'){ const cc=CASES.find(x=>x.id===el.dataset.case); if(cc){ ui.modal={type:'confirmCase', data:{caseId:cc.id}}; render(); } }
      else if(a==='confirm-case-open'){ const cid=el.dataset.case; ui.modal=null; render(); openCase(cid); }
      else if(a==='sell-item'){ sellItem(el.dataset.id); }
      else if(a==='sell-all'){ sellAll(); }
      else if(a==='open-withdraw'){ ui.modal={type:'withdraw'}; render(); }
      else if(a==='set-case-filter'){ ui.caseFilter = el.dataset.filter; render(); }
      else if(a==='view-profile'){ ui.modal={type:'profileDetail',data:{id:el.dataset.id}}; render(); }
      else if(a==='admin-self-coins') adminSelfCoins();
      else if(a==='admin-coins') adminAction('coins', {amount:document.getElementById('adminCoins')?.value});
      else if(a==='admin-take-coins') adminAction('take_coins', {amount:document.getElementById('adminTakeCoins')?.value});
      else if(a==='admin-take-all-coins') adminAction('take_all_coins');
      else if(a==='admin-character') adminAction('character', {item_id:document.getElementById('adminCharacter')?.value});
      else if(a==='admin-ban') adminAction('ban', {banned:el.dataset.ban==='true'});
      else if(a==='admin-refresh') refreshAdmin().then(()=>render()).catch(()=>toast('Не удалось обновить список'));
      else if(a==='logout') logout();
      else if(a==='set-platform'){ ui.platform = el.dataset.platform; render(); }
      else if(a==='set-theme'){ ui.theme = el.dataset.theme; render(); }
      else if(a==='set-accent'){ ui.accent = el.dataset.accent; render(); }
      else if(a==='pick-input-item'){ ui.upgradeInputId = el.dataset.id; const input=game.inventory.find(item=>item.instance_id===el.dataset.id); const target=ITEM_POOL.find(item=>item.id===ui.upgradeTargetId); if(target && (!input || target.value<=input.value)) ui.upgradeTargetId=null; ui.modal=null; render(); }
      else if(a==='pick-target-item'){ ui.upgradeTargetId=el.dataset.id; ui.modal=null; render(); }
      else if(a==='do-upgrade'){ doUpgrade(); }
    };
  });
  const overlay = document.getElementById('overlay');
  document.onkeydown = e=>{ if(e.key==='Escape' && ui.modal){ ui.modal=null; render(); } };
  document.querySelectorAll('.auth-card input').forEach(input=>input.onkeydown=e=>{if(e.key==='Enter') authenticate();});
  if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ ui.modal=null; render(); } });
  const avatar = document.querySelector('[data-action="avatar-file"]');
  if(avatar) avatar.addEventListener('change', (e)=>uploadAvatar(e.target.files?.[0]));
  const adminTarget = document.querySelector('[data-action="admin-target"]');
  if(adminTarget) adminTarget.addEventListener('change', (e)=>{ ui.adminTarget=e.target.value; render(); });
  const caseSearch = document.getElementById('caseSearch');
  if(caseSearch && !caseSearch.dataset.bound){
    caseSearch.dataset.bound = '1';
    caseSearch.addEventListener('input', (event)=>{
      ui.caseSearch = event.target.value;
      const grid = document.getElementById('caseGrid');
      if(grid){ grid.innerHTML = caseGridInner(); bindEvents(); }
    });
  }
}

(async function init(){
  try{
    await refreshFromServer();
  }catch(error){
    if(error.message==='banned') ui.authError='Этот аккаунт заблокирован.';
  }
  render();
})();
</script>
</body>
</html>
